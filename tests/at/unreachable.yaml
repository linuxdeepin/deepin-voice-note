unreachable:
  - name: model.name
    reason: |
      动态绑定名称（model.name），含 "."，cover.py 过滤为噪声。
      ItemListView 中 Rectangle 的 Accessible.name 绑定模型数据，无法静态定位。
  - name: ActionManager.actionTextmenuItem.menuId
    reason: |
      动态拼接名称（含 "."），cover.py 过滤为噪声。
      VNoteRightMenu.qml 中 MenuItem 的 Accessible.name 由 ActionManager 动态生成，无法静态定位。
  - name: VNoteButton
    reason: |
      通用按钮组件（gui/VNoteButton.qml），非场景1直接交互控件。
      场景1仅验证 Tiptap 默认启动与主编辑区可用，不涉及通用按钮组件本身。
  - name: VNoteToolButtonBackground
    reason: |
      通用工具按钮背景（gui/VNoteToolButton.qml），非场景1直接交互控件。
  - name: FolderList
