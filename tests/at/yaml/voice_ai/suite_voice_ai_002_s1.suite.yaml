name: suite_voice_ai_002_s1_suite
app: deepin-voice-note
module: voice_ai
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_voice_ai_002_s1
  name: 语音听写_AI唤起首次与快捷键
  description: 覆盖xlsx用例1873469、1676459「语音听写」；通过右键菜单点击语音听写，验证听写入口可触发并通过快捷键唤起
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: focus
    wait: 0.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 语音听写
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    selector:
      name: TiptapWebView
    key: Alt+M
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
