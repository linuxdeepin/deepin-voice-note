name: suite_记事本条目管理_013_s1_suite
app: deepin-voice-note
module: 记事本条目管理
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_记事本条目管理_013_s1
  name: 首次使用语音记事本新建记事本
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 记事本1
      role: label
    items:
    - DeleteFolderMenuItem
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
