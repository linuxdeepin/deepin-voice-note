name: suite_场景补充_005_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_场景补充_005_s1
  name: 多选笔记Shift选择与批量操作工具条
  description: 覆盖xlsx多选场景：Shift选择多条笔记后展示批量移动、保存笔记、删除等详情页工具条入口
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/select_two_notes_for_multiselect.py'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: MoveButton
  - step_type: assert
    action: assert_element
    selector:
      name: SaveNoteButton
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteButton
