name: suite_场景补充_008_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_场景补充_008_s1
  name: Tiptap选中文本格式快捷键与撤销重做
  description: 覆盖xlsx选中文本设置格式场景：选中文本后执行加粗、斜体、下划线、删除线快捷键，并执行撤销重做验证编辑区可用
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 选中文本格式化测试
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+A
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+B
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+I
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+U
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Shift+X
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Z
    wait: 0.3
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Shift+Z
    wait: 0.3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
