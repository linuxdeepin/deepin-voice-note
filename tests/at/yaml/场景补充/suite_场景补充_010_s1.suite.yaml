name: suite_场景补充_010_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
suites:
- id: suite_场景补充_010_s1
  name: 主菜单退出应用
  description: 覆盖xlsx主菜单退出场景：通过标题栏主菜单触发退出，验证进程结束
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/titlebar_menu_press.py --select ExitMenuItem'
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_process_not_running
    process: deepin-voice-note
