name: suite_快捷键使用_001_s1_suite
app: deepin-voice-note
module: 快捷键使用
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_快捷键使用_001_s1
  name: 空语音记录下Ctrl+Y快捷键禁用无异常
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+y
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_process_running
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
