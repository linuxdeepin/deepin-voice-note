name: suite_快捷键使用_003_s1_suite
app: deepin-voice-note
module: 快捷键使用
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_快捷键使用_003_s1
  name: 空白页Delete快捷键无作用无异常
  description: 覆盖xlsx用例1635263：空白页按Delete键无任何作用，应用无闪退等异常
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: Delete
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
