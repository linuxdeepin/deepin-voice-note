name: suite_启用语音记事本_004_s1_suite
app: deepin-voice-note
module: 启用语音记事本
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_启用语音记事本_004_s1
  name: 仅支持单个窗口开启验证
  description: 覆盖xlsx单实例场景：尝试二次启动应用，验证仍只有一个窗口
  steps:
  - step_type: action
    action: session_start
    command: bash -lc 'deepin-voice-note &'
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_window_count
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
