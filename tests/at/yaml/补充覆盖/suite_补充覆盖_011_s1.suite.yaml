name: suite_补充覆盖_011_s1_suite
app: deepin-voice-note
module: 补充覆盖
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_补充覆盖_011_s1
  name: 主菜单布局可访问控件验证
  description: 来源xlsx用例1676365「主菜单布局」；通过AT-SPI Press动作打开标题栏主菜单，验证设置、隐私政策、退出等菜单控件存在
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/titlebar_menu_press.py'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TitleBarMenu
  - step_type: assert
    action: assert_element
    selector:
      name: SettingsMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: PrivacyPolicyMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: ExitMenuItem
