name: suite_base_flow_002_s1_suite
app: deepin-voice-note
module: base_flow
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_base_flow_002_s1
  name: 新建笔记_多入口创建
  description: 覆盖1676341、1676411；通过笔记右键菜单、记事本右键菜单、Ctrl+B快捷键、新建笔记按钮+Enter四种入口创建文本笔记
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteItemListView
    items:
    - 新建笔记
    wait: 1.0
    note: 笔记列表右键菜单NoteContextMenu，菜单项NoteAddNew的accessible name为翻译后的"新建笔记"
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FolderListView
    items:
    - NewNoteFromFolderMenuItem
    wait: 1.0
    note: 记事本列表右键菜单FolderItemContextMenu，NewNoteFromFolderMenuItem有显式Accessible.name
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+b
    selector:
      name: MainShortcuts
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: focus
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: Return
    selector:
      name: NewNoteButton
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NewNoteButton
