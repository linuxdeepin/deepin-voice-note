name: suite_base_flow_002_s1_suite
app: deepin-voice-note
module: base_flow
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_base_flow_002_s1
  name: 新建笔记_多入口创建
  description: 覆盖1676341、1676411；通过新建记事本按钮、新建笔记按钮、Ctrl+B快捷键等稳定入口创建文本笔记，验证应用无异常
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+b
    selector:
      name: MainShortcuts
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: focus
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: Return
    selector:
      name: NewNoteButton
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NewNoteButton
