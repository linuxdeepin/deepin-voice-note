  description: 覆盖1635299、1635301；连续新建多个记事本和文本笔记，避免依赖瞬态右键删除菜单，验证批量创建后应用无崩溃且核心列表仍可定位
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
