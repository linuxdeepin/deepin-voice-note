name: suite_base_flow_003_s1_suite
app: deepin-voice-note
module: base_flow
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
