name: suite_记事本条目_002_s1_suite
app: deepin-voice-note
module: 记事本条目
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_记事本条目_002_s1
  name: 重命名记事本-右键菜单F2与双击正向流程
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 文本
      role: list item
    items:
    - 重命名
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: 记事本A
  - step_type: action
    action: keyboard_press
    key: Enter
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: F2
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: 记事本B
  - step_type: action
    action: keyboard_press
    key: Enter
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 记事本B
      role: list item
    do: double_click
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: 记事本C
  - step_type: action
    action: keyboard_press
    key: Enter
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
