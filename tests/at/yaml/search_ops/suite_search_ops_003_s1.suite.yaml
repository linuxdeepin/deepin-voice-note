name: suite_search_ops_003_s1_suite
app: deepin-voice-note
module: search_ops
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_search_ops_003_s1
  name: 搜索结果_保存TXT和保存语音
  description: 覆盖1635195、1635193；搜索结果页右键笔记通过保存笔记子菜单保存为TXT，通过保存语音菜单保存语音文件
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: search_save_001
    wait: 0.5
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py search_save_001'
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      parent: NoteItemListView
      name: 文本
      role: list item
    items:
    - 保存笔记
    - 保存为TXT
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/search_result_note.txt
  - step_type: action
    action: dtk_context_menu
    selector:
      parent: NoteItemListView
      name: 文本
      role: list item
    items:
    - 保存语音
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/search_result_voice.mp3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_file_exists
    path: /tmp/search_result_note.txt
  - step_type: assert
    action: assert_file_exists
    path: /tmp/search_result_voice.mp3
  skip: requires pre-existing note with both text and voice content in search results;
    保存语音 requires audio input device for voice note creation; nested QML context-menu
    submenu (保存笔记 -> 保存为TXT) navigation may time out; search box lacks Accessible.name
    and uses AT-SPI helper script
