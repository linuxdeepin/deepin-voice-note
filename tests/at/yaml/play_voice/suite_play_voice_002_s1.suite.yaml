name: suite_play_voice_002_s1_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source
    "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_002_s1
  name: 右键菜单_保存复制剪切删除
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 复制
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 剪切
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 粘贴
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 保存为MP3
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/voice_item.mp3
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 删除
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
  - step_type: assert
    action: assert_file_exists
    path: /tmp/voice_item.mp3
