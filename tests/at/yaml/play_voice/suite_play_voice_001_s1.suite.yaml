name: suite_play_voice_001_s1_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source
    "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_001_s1
  name: 播放暂停与Space快捷键
  description: ''
  steps:
  - step_type: action
    action: mouse_click
    selector:
      name: TiptapWebView
  - step_type: action
    action: mouse_click
    selector:
      name: TiptapWebView
  - step_type: action
    action: mouse_click
    selector:
      name: TiptapWebView
  - step_type: action
    action: keyboard_press
    key: space
    selector:
      name: TiptapWebView
  - step_type: action
    action: keyboard_press
    key: space
    selector:
      name: TiptapWebView
  assert_steps:
  - step_type: assert
    action: assert_process_running
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
