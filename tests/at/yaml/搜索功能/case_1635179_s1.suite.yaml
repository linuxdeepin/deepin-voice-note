name: 搜索功能(#115119)_case_1635179_s1_suite
app: deepin-voice-note
description: 覆盖xlsx搜索特殊字符场景：输入~!@#$%^&*.<>?/等特殊字符搜索，验证无异常
module: 搜索功能(#115119)
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: case_1635179_s1
  name: 搜索框输入特殊字符搜索无异常
  description: 覆盖xlsx用例1635179：搜索框输入特殊字符进行搜索
  tags: []
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py ~!@#$%^&*.<>?/'
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
