name: 搜索功能(#115119)_case_1635183_s1_suite
app: deepin-voice-note
description: 覆盖xlsx搜索匹配场景：关键字匹配文本笔记、不匹配关键字搜索
module: 搜索功能(#115119)
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: case_1635183_s1
  name: 搜索关键字匹配文本笔记与不匹配搜索
  description: 覆盖xlsx用例1635183：搜索匹配关键字显示结果，不匹配关键字无结果
  tags: []
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py 文本'
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.5
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py ZZZNoMatch999'
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
