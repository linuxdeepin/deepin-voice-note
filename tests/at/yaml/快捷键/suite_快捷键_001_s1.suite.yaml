name: suite_快捷键_001_s1_suite
app: deepin-voice-note
module: 快捷键
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_快捷键_001_s1
  name: 快捷键预览显示Ctrl+Shift+问号触发
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+?
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MainShortcuts
