  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: click
  - step_type: action
    action: keyboard_type
    text: 测试文本内容
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 全选
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 复制
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
    - 剪切
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TiptapWebView
    items:
