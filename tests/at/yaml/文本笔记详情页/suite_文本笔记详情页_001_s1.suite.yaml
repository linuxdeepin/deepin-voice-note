name: suite_文本笔记详情页_001_s1_suite
app: deepin-voice-note
module: 文本笔记详情页
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_文本笔记详情页_001_s1
  name: 详情页右键全选复制剪切粘贴删除文本操作
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
  - step_type: action
    action: keyboard_type
    text: 测试文本内容
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteContentWebView
    items:
    - 全选
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteContentWebView
    items:
    - 全选
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteContentWebView
    items:
    - 全选
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteContentWebView
    items:
    - 粘贴
  - step_type: action
    action: dtk_context_menu
    selector:
      name: NoteContentWebView
    items:
    - 全选
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
