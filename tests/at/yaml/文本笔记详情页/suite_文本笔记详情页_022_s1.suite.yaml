name: suite_文本笔记详情页_022_s1_suite
app: deepin-voice-note
module: 文本笔记详情页
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_文本笔记详情页_022_s1
  name: 重命名文本笔记正向流程
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 文本
      role: list item
    items:
    - 重命名
  - step_type: action
    action: keyboard_type
    text: 重命名测试
  - step_type: action
    action: keyboard_press
    key: Return
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
