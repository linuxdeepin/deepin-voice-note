name: suite_文本笔记详情页_038_s1_suite
app: deepin-voice-note
module: 文本笔记详情页
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_文本笔记详情页_038_s1
  name: 新建文本笔记多种入口验证
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 文本
      role: list item
    items:
    - 新建笔记
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 记事本1
      role: label
    items:
    - NewNoteFromFolderMenuItem
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
