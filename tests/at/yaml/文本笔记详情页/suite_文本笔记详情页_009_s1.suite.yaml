name: suite_文本笔记详情页_009_s1_suite
app: deepin-voice-note
module: 文本笔记详情页
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_文本笔记详情页_009_s1
  name: 详情页输入内容键入空格Tab
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
  - step_type: action
    action: keyboard_type
    text: 任意内容
  - step_type: action
    action: keyboard_press
    key: Space
  - step_type: action
    action: keyboard_type
    text: 空格后内容
  - step_type: action
    action: keyboard_press
    key: Tab
  - step_type: action
    action: keyboard_type
    text: Tab后内容
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
