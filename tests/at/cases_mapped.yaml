  - id: case_1676219
    name: 编辑区右键菜单_空白与未选中文本菜单
    module: edit_img
    status: active
    covers: [1676219, 1676217, 1873449]
    steps:
      - step_type: action
        action: session_start
        command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
        wait: 6.0
        description: 启动应用
      - step_type: action
        action: element_action
        selector: {role: "pane", name: "TiptapWebView"}
        do: click
        description: 点击正文编辑区
      - step_type: action
        action: mouse_right_click
        selector: {role: "pane", name: "TiptapWebView"}
        description: 右键正文编辑区空白处
      - step_type: assert
        action: assert_element
        selector: {role: "popup menu", name: "TextContextMenu"}
        description: 验证文本右键菜单弹出
      - step_type: assert
        action: assert_not_exists
        selector: {role: "menu item", name: "文本翻译"}
        description: 验证菜单中不存在"文本翻译"
      - step_type: action
        action: keyboard_press
        key: "escape"
        description: 关闭右键菜单
      - step_type: action
        action: element_action
        selector: {role: "pane", name: "TiptapWebView"}
        do: click
        description: 点击正文编辑区
      - step_type: action
        action: mouse_right_click
        selector: {role: "pane", name: "TiptapWebView"}
        description: 再次右键正文编辑区
