version: '1.0'
scenario: 场景1_Tiptap默认启动与主编辑区可用
app: deepin-voice-note
repo: https://github.com/linuxdeepin/deepin-voice-note.git
branch: develop/snipe
suites:
- id: suite_场景1_001
  name: 启动应用验证主窗口
  module: 场景1_Tiptap默认启动与主编辑区可用
  description: 验证应用启动后主窗口可见，初始界面展示创建文件夹入口
  status: automated
  elements:
  - VoiceNoteMainWindow
  - InitialInterface
  - CreateFolderButton
  - SidebarBlurBackground
- id: suite_场景1_002
  name: 创建文件夹后验证笔记列表
  module: 场景1_Tiptap默认启动与主编辑区可用
  description: 创建文件夹后验证文件夹列表与笔记列表可见
  status: automated
  elements:
  - CreateFolderButton
  - FolderListView
  - NoteItemListView
- id: suite_场景1_003
  name: 新建笔记验证TiptapWebView与详情页编辑区
  module: 场景1_Tiptap默认启动与主编辑区可用
  description: 新建笔记后验证TiptapWebView可访问、详情页编辑区与标题栏可见
  status: automated
  elements:
  - CreateFolderButton
  - NewNoteButton
  - TiptapWebView
  - NoteContentWebView
  - WebViewTitleBar
- id: suite_场景1_004
  name: 新建笔记后编辑区仍可用
  module: 场景1_Tiptap默认启动与主编辑区可用
  description: 连续新建两条笔记，验证每次新建后TiptapWebView编辑区仍可访问
  status: automated
  elements:
  - CreateFolderButton
  - NewNoteButton
  - TiptapWebView
