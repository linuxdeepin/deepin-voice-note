      - step_type: action
        action: element_action
        selector: {name: "MoveButton"}
        do: click
        wait: 1.0
        description: 点击移动按钮
      - step_type: action
        action: mouse_click
        selector: {name: "MoveNoteDialog", role: "dialog"}
        description: 验证移动对话框已弹出
      - step_type: action
        action: element_action
        selector: {name: "FolderList", role: "list"}
        do: click
        wait: 0.5
        description: 选择目标记事本
      - step_type: action
        action: element_action
        selector: {name: "MoveDialogOk", role: "button"}
        do: click
        wait: 1.0
        description: 点击确定按钮完成移动
      - step_type: action
        action: session_start
        command: bash -lc './tests/at/scripts/select_two_notes_for_multiselect.py'
        wait: 2.0
        description: 再次多选两条笔记
      - step_type: action
        action: element_action
        selector: {name: "DeleteButton"}
        do: click
        wait: 1.0
        description: 点击删除按钮
      - step_type: action
        action: element_action
        selector: {name: "删除", role: "button"}
        do: click
        wait: 1.0
        description: 点击删除确认按钮
      - step_type: assert
        action: assert_element
        selector: {name: "CreateFolderButton", role: "button"}
        description: 验证应用主界面存在
      - step_type: assert
        action: assert_element
        selector: {name: "MultipleChoicesView"}
        description: 验证多选工具栏已显示

