<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiptap Editor</title>
  <style>
    html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { margin: 0; padding: 0; width: 100%; height: 100%; cursor: text; overflow-x: hidden; overflow-y: auto; background-color: var(--dvn-editor-bg, #ffffff); color: var(--dvn-editor-fg, rgba(0, 0, 0, 1)); }
    #toolbar-host { position: sticky; top: 0; z-index: 10; min-height: 48px; box-sizing: border-box; display: flex; align-items: center; background: var(--dvn-panel-bg, #fbfbfd); border-bottom: 1px solid var(--dvn-toolbar-border, rgba(0, 0, 0, 0.08)); overflow: visible; }
    #note-title-host { min-height: 68px; box-sizing: border-box; display: flex; align-items: flex-start; padding: 13px 20px 4px 30px; background: var(--dvn-editor-bg, #ffffff); }
    #note-title-input { width: 100%; min-width: 0; box-sizing: border-box; border: 0; outline: none; padding: 0; background: transparent; color: var(--dvn-title-fg, rgba(0, 0, 0, 0.30)); caret-color: var(--highlightColor, #0086cc); font: 600 24px/1.4 var(--dvn-editor-default-font, Helvetica), sans-serif; }
    #note-title-input.is-custom { color: var(--dvn-editor-fg, rgba(0, 0, 0, 1)); }
    #note-title-input::selection { background: var(--dvn-active-selection-bg, rgba(98, 80, 192, 0.35)); }
    #app { width: 100%; min-height: calc(100% - 100px); box-sizing: border-box; overflow: visible; }
    .tiptap { width: 100%; min-height: 100%; box-sizing: border-box; overflow: visible; }
    /* Match legacy summernote .note-editable geometry for migration display fidelity. */
    .ProseMirror { box-sizing: border-box; outline: none; width: 100%; min-height: 100%; overflow: visible; padding: 0 20px 50px 30px; cursor: text; font-family: var(--dvn-editor-default-font, Helvetica), sans-serif; font-size: 14px; line-height: 1.72; color: var(--dvn-editor-fg, rgba(0, 0, 0, 1)); word-wrap: break-word; }
    .ProseMirror::selection, .ProseMirror ::selection { background: var(--dvn-active-selection-bg, rgba(0, 129, 255, 0.6)); color: var(--dvn-selection-fg, #ffffff); }
    #app.is-empty .ProseMirror::before { content: '请输入正文'; display: block; height: 0; color: var(--dvn-placeholder-fg, rgba(0, 0, 0, 0.25)); pointer-events: none; }
    #app.is-empty[data-empty-block="heading"] .ProseMirror::before { font-weight: 700; line-height: 1.2; }
    #app.is-empty[data-empty-heading-level="1"] .ProseMirror::before { font-size: 28px; }
    #app.is-empty[data-empty-heading-level="2"] .ProseMirror::before { font-size: 21px; }
    #app.is-empty[data-empty-heading-level="3"] .ProseMirror::before { font-size: 16px; }
    #app.is-empty[data-empty-heading-level="4"] .ProseMirror::before { font-size: 14px; }
    #app.is-empty[data-empty-heading-level="5"] .ProseMirror::before { font-size: 12px; }
    #app.is-empty[data-empty-heading-level="6"] .ProseMirror::before { font-size: 10px; }
    .ProseMirror p { margin: 0; min-height: 1.72em; }
    .ProseMirror h1, .ProseMirror h2, .ProseMirror h3, .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { margin: 0; font-weight: 700; line-height: 1.2; }
    .ProseMirror h1 { font-size: 28px; }
    .ProseMirror h2 { font-size: 21px; }
    .ProseMirror h3 { font-size: 16px; }
    .ProseMirror h4 { font-size: 14px; }
    .ProseMirror h5 { font-size: 12px; }
    .ProseMirror h6 { font-size: 10px; }
    /* Match legacy Summernote list spacing from saved note CSS.
       Browser defaults indent lists too far and can make migrated long lines
       wrap earlier than the original note. */
    .ProseMirror ul, .ProseMirror ol { margin: 0; padding-left: 20px; }
    .ProseMirror li { margin: 0; padding-left: 0; }
    .ProseMirror li > p { margin: 0; min-height: 0; }
    /* Match legacy Summernote image geometry while keeping img inline inside its paragraph. */
    .ProseMirror img { box-sizing: border-box; padding: 4px !important; max-width: 100% !important; }

    /* Match legacy Summernote scrollbar: transparent track, 10px thumb, transient visibility while scrolling. */
    body::-webkit-scrollbar-track {
      -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0);
      background-color: rgba(0, 0, 0, 0);
    }
    body::-webkit-scrollbar { width: 10px; height: 10px; }
    body::-webkit-scrollbar:horizontal { height: 10px; }
    body::-webkit-scrollbar-thumb {
      border-radius: 5px;
      border-style: dashed;
      border-color: transparent;
      border-width: 2px;
      background-clip: padding-box;
      background-color: transparent;
    }
    body.dvn-scrolling::-webkit-scrollbar-thumb {
      background-color: var(--dvn-scrollbar-thumb, rgba(0, 0, 0, 0.30));
    }
    body::-webkit-scrollbar-thumb:hover {
      border-width: 1px;
      background-color: var(--dvn-scrollbar-thumb-hover, rgba(0, 0, 0, 0.50));
      border-radius: 5px;
      border-color: rgba(0, 0, 0, 0.05);
    }
    body::-webkit-scrollbar-thumb:active {
      border-width: 1px;
      background-color: var(--dvn-scrollbar-thumb-active, rgba(0, 0, 0, 0.40));
      border-radius: 5px;
      border-color: rgba(0, 0, 0, 0.05);
    }
    body::-webkit-scrollbar-corner {
      background: transparent;
      opacity: 0;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toolbar-host"></div>
  <div id="note-title-host">
    <input id="note-title-input" type="text" maxlength="24" autocomplete="off" spellcheck="false" aria-label="Note title" />
  </div>
  <div id="app"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="module" src="./tiptap-editor.js"></script>
</body>
</html>
