  qwebchannel.js 由 Qt WebEngine 提供（qrc:///qtwebchannel/qwebchannel.js）。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiptap Editor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; cursor: text; }
    #toolbar-host { position: sticky; top: 0; z-index: 10; }
    #app { min-height: calc(100% - 36px); }
    .tiptap { min-height: 100%; }
    /* Match legacy summernote .note-editable geometry for migration display fidelity. */
    .ProseMirror { box-sizing: border-box; outline: none; min-height: 100%; padding: 20px 20px 50px 30px; cursor: text; font-family: Helvetica, sans-serif; font-size: 14px; line-height: 1.72; color: rgba(0, 0, 0, 1); word-wrap: break-word; }
    .ProseMirror p { margin: 0; min-height: 1.72em; }
  </style>
</head>
<body>
  <div id="toolbar-host"></div>
  <div id="app"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="module" src="./tiptap-editor.js"></script>
</body>
</html>
