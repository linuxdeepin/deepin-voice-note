version: '1'

package:
  id: org.deepin.voice.note
  name: deepin-voice-note
  version: 6.5.62.1
  kind: app
  description: |
    voice note for deepin os

command:
  - deepin-voice-note

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.webengine/6.7.0

build: |
  # 修正lrelease路径
  sed -i 's|/usr/lib/qt[56]/bin/lrelease|lrelease|' $PWD/assets/translate_generation.sh

  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  rm -rf build
  cmake -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install >install.log 2>&1

buildext:
  apt:
    build_depends:
      - cmake
      - pkg-config
      - libvlc-dev
      - libgstreamer1.0-dev
    depends:
      - libvlc5
      - vlc-plugin-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
